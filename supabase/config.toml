# Supabase CLI configuration (supabase start / supabase db push / deploy).
# Public configuration only. Secrets are supplied via environment variables.

project_id = "notes"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[analytics]
enabled = true
port = 54327

[functions]
enabled = true
verify_jwt = false

# All note functions are public endpoints (no Supabase Auth), so JWT
# verification is disabled. Protected-note authorization is handled inside the
# functions via NOTE_TOKEN_SECRET-signed tokens, not via Supabase Auth.
[functions.create-note]
verify_jwt = false

[functions.list-public-notes]
verify_jwt = false

[functions.get-note]
verify_jwt = false

[functions.unlock-note]
verify_jwt = false

[functions.update-note]
verify_jwt = false

[functions.delete-note]
verify_jwt = false

[auth]
enabled = false
