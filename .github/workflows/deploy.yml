name: Deploy Web to GitHub Pages & Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web app (PWA)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Inject Supabase config into index.html
        run: |
          out=composeApp/build/dist/wasmJs/productionExecutable/index.html
          sed -i \
            -e "s|@@SUPABASE_URL@@|${{ vars.SUPABASE_URL }}|g" \
            -e "s|@@SUPABASE_ANON_KEY@@|${{ vars.SUPABASE_PUBLISHABLE_KEY }}|g" \
            "$out"
          # Fail loudly if substitution did not happen.
          grep -q "@@SUPABASE" "$out" \
            && { echo "::error::Config placeholders remain in $out" ; exit 1; } \
            || true

      # --- GitHub Pages ---
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- Cloudflare Pages ---
      # wrangler-action@v4 runs on Node 24 (v3 used Node 20, now deprecated).
      # The repo has no package.json, so the action's `npx --no-install
      # wrangler --version` precheck fails; install wrangler explicitly and pin
      # the version so the deploy step can invoke `wrangler pages deploy`.
      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: >-
            pages deploy composeApp/build/dist/wasmJs/productionExecutable
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
