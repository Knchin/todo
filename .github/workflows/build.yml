name: Build

on:
  push:
    branches:
      - main

jobs:
  android-web:
    name: Android + Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Build Web app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

  ios:
    name: iOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 :composeApp:linkDebugFrameworkIosArm64 --no-daemon

  server:
    name: Server (Supabase)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    env:
      # Connection details come from git secrets/variables — no DATABASE_URL
      # is hardcoded; the JDBC URL is derived from SUPABASE_URL in AppConfig.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_SSL: 'true'
      SERVER_PORT: '8080'
      LOG_LEVEL: 'INFO'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build server distribution
        run: ./gradlew :server:installDist --no-daemon

      - name: Start server and verify it connects to Supabase
        run: |
          ./server/build/install/server/bin/server &
          pid=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://localhost:${SERVER_PORT}/"; then
              echo "Server is up and connected."
              kill $pid
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start / connect." >&2
          kill $pid 2>/dev/null || true
          exit 1

